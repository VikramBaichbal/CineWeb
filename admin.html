<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineWeb Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
    }

    .logo span {
      color: #ff0000;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back {
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
    }

    .logout {
      background: #292929;
      color: white;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 28px 18px 50px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .card h2 {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0d0d0d;
      color: white;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff0000;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #ff0000;
      color: white;
    }

    .primary:hover {
      background: #d90000;
    }

    .secondary {
      background: #292929;
      color: white;
    }

    .status {
      margin-top: 14px;
      color: #aaa;
      min-height: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 28px;
    }

    .login-card h1 {
      font-size: 28px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .login-card p {
      color: #999;
      margin-bottom: 22px;
    }

    .login-card input {
      margin-bottom: 12px;
    }

    .login-card button {
      width: 100%;
    }

    /* MOVIE LIST */

    .movie-list {
      display: grid;
      gap: 12px;
    }

    .movie-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #0e0e0e;
      border: 1px solid #292929;
      border-radius: 10px;
    }

    .movie-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .movie-info small {
      color: #999;
    }

    .empty {
      color: #888;
      padding: 10px 0;
    }

    @media (max-width: 700px) {

      header {
        padding: 14px;
      }

      .logo {
        font-size: 23px;
      }

      .back {
        display: none;
      }

      .container {
        padding: 22px 14px 40px;
      }

      h1 {
        font-size: 27px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 17px;
      }

      .movie-item {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================== -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">
        Cine<span>Web</span> Admin
      </div>

      <h1>Admin Login</h1>

      <p>
        Sign in to manage CineWeb movies.
      </p>

      <input
        id="loginEmail"
        type="email"
        placeholder="Admin email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button
        id="loginBtn"
        class="primary"
      >
        Login
      </button>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

  </section>


  <!-- =========================
       ADMIN DASHBOARD
  ========================== -->

  <div
    id="dashboard"
    class="hidden"
  >

    <header>

      <div class="logo">
        Cine<span>Web</span> Admin
      </div>

      <div class="header-actions">

        <a
          class="back"
          href="index.html"
        >
          ← Back to CineWeb
        </a>

        <button
          id="logoutBtn"
          class="logout"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="container">

      <h1>
        Admin Dashboard
      </h1>

      <p class="subtitle">
        Manage movies displayed on your CineWeb website.
      </p>


      <!-- ADD MOVIE -->

      <section class="card">

        <h2>
          ➕ Add New Movie
        </h2>

        <div class="grid">

          <input
            id="title"
            type="text"
            placeholder="Movie title"
          >

          <input
            id="year"
            type="number"
            placeholder="Release year"
          >

          <input
            id="genre"
            type="text"
            placeholder="Genre"
          >

          <input
            id="language"
            type="text"
            placeholder="Language"
          >

          <input
            id="rating"
            type="number"
            step="0.1"
            min="0"
            max="10"
            placeholder="Rating"
          >

          <input
            id="director"
            type="text"
            placeholder="Director"
          >

          <input
            id="cast_members"
            class="full"
            type="text"
            placeholder="Cast members"
          >

          <textarea
            id="description"
            class="full"
            placeholder="Movie description"
          ></textarea>

          <input
            id="poster"
            class="full"
            type="url"
            placeholder="Poster image URL"
          >

          <input
            id="backdrop"
            class="full"
            type="url"
            placeholder="Backdrop image URL"
          >

        </div>


        <button
          id="addMovieBtn"
          class="primary"
          style="margin-top:18px"
        >
          Add Movie
        </button>


        <div
          id="movieStatus"
          class="status"
        ></div>

      </section>


      <!-- MOVIE LIST -->

      <section class="card">

        <h2>
          🎬 Movies in CineWeb
        </h2>

        <div
          id="movieList"
          class="movie-list"
        >

          <div class="empty">
            Loading movies...
          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /*
      IMPORTANT:

      Use your SUPABASE PUBLISHABLE KEY here.

      NEVER put the SUPABASE SECRET KEY here.
    */

    const SUPABASE_URL =
      "https://eutkrnurpbefkabchqj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const loginScreen =
      document.getElementById("loginScreen");

    const dashboard =
      document.getElementById("dashboard");
