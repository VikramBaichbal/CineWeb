<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineWeb Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
    }

    .logo span {
      color: #ff0000;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back {
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #ff0000;
      color: white;
    }

    .primary:hover {
      background: #d90000;
    }

    .logout {
      background: #292929;
      color: white;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 28px 18px 50px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .card h2 {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    input,
    textarea {
      width: 100%;
      background: #0d0d0d;
      color: white;
      border: 1px solid #383838;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff0000;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .status {
      margin-top: 14px;
      color: #aaa;
      min-height: 20px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 28px;
    }

    .login-card h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-card p {
      color: #999;
      margin-bottom: 22px;
    }

    .login-card input {
      margin-bottom: 12px;
    }

    .login-card button {
      width: 100%;
    }

    .movie-list {
      display: grid;
      gap: 12px;
    }

    .movie-item {
      padding: 15px;
      background: #0e0e0e;
      border: 1px solid #292929;
      border-radius: 10px;
    }

    .movie-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .movie-info small {
      color: #999;
    }

    .empty {
      color: #888;
      padding: 10px 0;
    }

    @media (max-width: 700px) {
      header {
        padding: 14px;
      }

      .logo {
        font-size: 23px;
      }

      .back {
        display: none;
      }

      .container {
        padding: 22px 14px 40px;
      }

      h1 {
        font-size: 27px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-card">

      <div class="logo">
        Cine<span>Web</span> Admin
      </div>

      <h1 style="margin-top:18px">
        Admin Login
      </h1>

      <p>
        Sign in to manage CineWeb movies.
      </p>

      <input
        id="loginEmail"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        class="primary"
        type="button"
      >
        Login
      </button>

      <div id="loginStatus" class="status"></div>

    </div>
  </section>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <header>

      <div class="logo">
        Cine<span>Web</span> Admin
      </div>

      <div class="header-actions">

        <a
          class="back"
          href="index.html"
        >
          ← Back to CineWeb
        </a>

        <button
          id="logoutBtn"
          class="logout"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="container">

      <h1>
        Admin Dashboard
      </h1>

      <p class="subtitle">
        Manage movies displayed on your CineWeb website.
      </p>


      <!-- ADD MOVIE -->
      <section class="card">

        <h2>
          ➕ Add New Movie
        </h2>

        <div class="grid">

          <input
            id="title"
            type="text"
            placeholder="Movie title"
          >

          <input
            id="year"
            type="number"
            placeholder="Release year"
          >

          <input
            id="genre"
            type="text"
            placeholder="Genre"
          >

          <input
            id="language"
            type="text"
            placeholder="Language"
          >

          <input
            id="rating"
            type="number"
            step="0.1"
            min="0"
            max="10"
            placeholder="Rating"
          >

          <input
            id="director"
            type="text"
            placeholder="Director"
          >

          <input
            id="cast_members"
            class="full"
            type="text"
            placeholder="Cast members"
          >

          <textarea
            id="description"
            class="full"
            placeholder="Movie description"
          ></textarea>

          <input
            id="poster"
            class="full"
            type="url"
            placeholder="Poster image URL"
          >

          <input
            id="backdrop"
            class="full"
            type="url"
            placeholder="Backdrop image URL"
          >

        </div>


        <button
          id="addMovieBtn"
          class="primary"
          style="margin-top:18px"
          type="button"
        >
          Add Movie
        </button>

        <div
          id="movieStatus"
          class="status"
        ></div>

      </section>


      <!-- MOVIE LIST -->
      <section class="card">

        <h2>
          🎬 Movies in CineWeb
        </h2>

        <div
          id="movieList"
          class="movie-list"
        >
          <div class="empty">
            Loading movies...
          </div>
        </div>

      </section>

    </main>

  </div>


<script>

  /*
    =====================================================
    SUPABASE CONFIGURATION
    =====================================================

    Use the PUBLIC Supabase project URL.

    NEVER put your Supabase SECRET KEY here.
  */

  const SUPABASE_URL =
    "https://euutkrnurpbefkabchqj.supabase.co";


  /*
    IMPORTANT:
    Put your EXISTING SUPABASE PUBLISHABLE KEY below.

    Do NOT use sb_secret_...
  */

  const SUPABASE_PUBLISHABLE_KEY =
    "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


  /*
    =====================================================
    CHECK SUPABASE LIBRARY
    =====================================================
  */

  const loginStatus =
    document.getElementById("loginStatus");

  if (!window.supabase) {

    loginStatus.textContent =
      "❌ Supabase library failed to load. Please refresh the page.";

    throw new Error(
      "Supabase JavaScript library was not loaded."
    );
  }


  /*
    =====================================================
    CREATE SUPABASE CLIENT
    =====================================================
  */

  let supabaseClient;

  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

  } catch (error) {

    loginStatus.textContent =
      "❌ Supabase configuration error.";

    console.error(
      "Supabase client error:",
      error
    );

    throw error;
  }


  /*
    =====================================================
    DOM ELEMENTS
    =====================================================
  */

  const loginScreen =
    document.getElementById("loginScreen");

  const dashboard =
    document.getElementById("dashboard");

  const movieStatus =
    document.getElementById("movieStatus");

  const movieList =
    document.getElementById("movieList");


  /*
    =====================================================
    SHOW DASHBOARD
    =====================================================
  */

  function showDashboard() {

    loginScreen.classList.add("hidden");

    dashboard.classList.remove("hidden");

    loadMovies();
  }


  /*
    =====================================================
    SHOW LOGIN
    =====================================================
  */

  function showLogin() {

    dashboard.classList.add("hidden");

    loginScreen.classList.remove("hidden");
  }


  /*
    =====================================================
    LOGIN
    =====================================================
  */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async function () {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!email || !password) {

        loginStatus.textContent =
          "❌ Enter your email and password.";

        return;
      }


      /*
        Show this immediately.
        This also confirms that the button
        JavaScript is working.
      */

      loginStatus.textContent =
        "Signing in...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          console.error(
            "Supabase login error:",
            error
          );

          loginStatus.textContent =
            "❌ " + error.message;

          return;
        }


        if (!data || !data.session) {

          loginStatus.textContent =
            "❌ Login failed: no session was returned.";

          return;
        }


        loginStatus.textContent =
          "✅ Login successful.";

        showDashboard();

      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        loginStatus.textContent =
          "❌ " +
          (error.message ||
           "Unable to connect to Supabase.");
      }

    });


  /*
    =====================================================
    LOGOUT
    =====================================================
  */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async function () {

      await supabaseClient.auth.signOut();

      showLogin();
    });


  /*
    =====================================================
    LOAD MOVIES
    =====================================================
  */

  async function loadMovies() {

    movieList.innerHTML =
      '<div class="empty">Loading movies...</div>';


    try {

      const response =
        await fetch(
          "/.netlify/functions/movies"
        );


      if (!response.ok) {

        throw new Error(
          "Could not load movies."
        );
      }


      const movies =
        await response.json();


      if (
        !Array.isArray(movies) ||
        movies.length === 0
      ) {

        movieList.innerHTML =
          '<div class="empty">No movies found.</div>';

        return;
      }


      movieList.innerHTML =
        movies
          .map(function (movie) {

            return `
              <div class="movie-item">

                <div class="movie-info">

                  <strong>
                    ${escapeHtml(movie.title)}
                  </strong>

                  <small>
                    ${escapeHtml(movie.year)}
                    •
                    ${escapeHtml(movie.genre)}
                    •
                    ${escapeHtml(movie.language)}
                    •
                    ⭐ ${escapeHtml(movie.rating)}
                  </small>

                </div>

              </div>
            `;

          })
          .join("");

    } catch (error) {

      movieList.innerHTML =
        `<div class="empty">
          ❌ ${escapeHtml(error.message)}
        </div>`;
    }
  }


  /*
    =====================================================
    ADD MOVIE
    =====================================================
  */

  document
    .getElementById("addMovieBtn")
    .addEventListener("click", async function () {

      movieStatus.textContent =
        "Adding movie...";


      const movie = {

        title:
          document
            .getElementById("title")
            .value
            .trim(),

        year:
          document
            .getElementById("year")
            .value,

        genre:
          document
            .getElementById("genre")
            .value
            .trim(),

        language:
          document
            .getElementById("language")
            .value
            .trim(),

        rating:
          document
            .getElementById("rating")
            .value,

        director:
          document
            .getElementById("director")
            .value
            .trim(),

        cast_members:
          document
            .getElementById("cast_members")
            .value
            .trim(),

        description:
          document
            .getElementById("description")
            .value
            .trim(),

        poster:
          document
            .getElementById("poster")
            .value
            .trim(),

        backdrop:
          document
            .getElementById("backdrop")
            .value
            .trim()
      };


      for (const key in movie) {

        if (!movie[key]) {

          movieStatus.textContent =
            "❌ Please fill in all movie fields.";

          return;
        }
      }


      try {

        const {
          data
        } =
          await supabaseClient.auth.getSession();


        if (!data.session) {

          movieStatus.textContent =
            "❌ Your login session has expired.";

          showLogin();

          return;
        }


        const response =
          await fetch(
            "/.netlify/functions/admin-movies",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  data.session.access_token
              },

              body:
                JSON.stringify(movie)
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "Failed to add movie."
          );
        }


        movieStatus.textContent =
          "✅ Movie added successfully.";


        document
          .querySelectorAll(
            "#title,#year,#genre,#language,#rating,#director,#cast_members,#description,#poster,#backdrop"
          )
          .forEach(function (input) {

            input.value = "";

          });


        await loadMovies();


      } catch (error) {

        console.error(
          "Add movie error:",
          error
        );

        movieStatus.textContent =
          "❌ " +
          (error.message ||
           "Failed to add movie.");
      }

    });


  /*
    =====================================================
    ESCAPE HTML
    =====================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
    =====================================================
    AUTH STATE
    =====================================================
  */

  supabaseClient.auth.onAuthStateChange(
    function (_event, session) {

      if (session) {

        showDashboard();

      } else {

        showLogin();
      }

    }
  );


  /*
    =====================================================
    INITIAL SESSION CHECK
    =====================================================
  */

  async function checkSession() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(
          "Session check error:",
          error
        );

        showLogin();

        return;
      }


      if (data.session) {

        showDashboard();

      } else {

        showLogin();
      }

    } catch (error) {

      console.error(
        "Session error:",
        error
      );

      showLogin();
    }
  }


  checkSession();

</script>

</body>
</html>
